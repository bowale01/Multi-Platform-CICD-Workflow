# NGINX configuration for dev.adelekeadebowale.com
# Port: 3002

server {
    listen 80;
    server_name dev.adelekeadebowale.com;
    
    # Redirect HTTP to HTTPS (after SSL is configured)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.adelekeadebowale.com;
    
    # SSL certificates (will be configured by Certbot)
    # ssl_certificate /etc/letsencrypt/live/dev.adelekeadebowale.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dev.adelekeadebowale.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # Logging
    access_log /var/log/nginx/dev-adelekeadebowale-access.log;
    error_log /var/log/nginx/dev-adelekeadebowale-error.log;
    
    # Proxy to Docker container on port 3002
    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
